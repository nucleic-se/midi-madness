name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native MIDI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: npm ci
      - run: npm run boundary:check
      - run: npm run check
      - run: npm test
      - run: npm run foundation:test
      - run: npm run graphics:test
      - run: npm run format:check
